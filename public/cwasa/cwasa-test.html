<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>VoicePandita Sign Avatar Test</title>

  <link rel="stylesheet"
    href="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2026/cwa/cwasa.css" />

  <script
    src="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2026/cwa/allcsa.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    .player-card {
      width: 420px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .avatar-box {
      width: 360px;
      height: 400px;
      margin: auto;
      background: #e9eef5;
      border-radius: 16px;
      overflow: hidden;
    }

    .controls {
      margin-top: 16px;
    }

    h2 {
      margin-bottom: 20px;
    }
  </style>
</head>

<body onload="CWASA.init();">

  <div class="player-card">
    <h2>VoicePandita Sign Avatar</h2>

    <div class="avatar-box">
      <div class="CWASAAvatar av0" align="center"></div>
    </div>

    <div class="controls">
      <p>Avatar: <span class="CWASAAvMenu av0"></span></p>

      <p>SiGML URL:</p>
      <div class="CWASASiGMLURL av0"></div>

      <p>SiGML Text:</p>
      <div class="CWASASiGMLText av0"></div>

      <div class="CWASAPlay av0"></div>

      <p>Status:</p>
      <div class="CWASAStatus av0"></div>
    </div>
  </div>

  <div class="SToCA" align="center"></div>

</body>
</html>
